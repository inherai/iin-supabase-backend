name: Deploy Edge Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: newer CLIs reject the [inbucket] section in config.toml and fail before deploying.
          # Matches the version used for local development.
          version: 2.107.0

      - name: Deploy api function
        run: supabase functions deploy api --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy publish-scheduled-posts function
        run: supabase functions deploy publish-scheduled-posts --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Job-enrichment worker, triggered by the process_job_ai_v3 Database Webhook.
      # Supabase edge-function webhooks send an Authorization header, so JWT
      # verification stays on (secure default).
      - name: Deploy process-job-ai function
        run: supabase functions deploy process-job-ai --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
